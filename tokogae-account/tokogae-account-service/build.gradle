buildService {
	apiDir = "../tokogae-account-api/src/main/java"
	databaseNameMaxLength = 64
}

dependencies {
	compileOnly group: "com.liferay", name: "biz.aQute.bnd.annotation", version: "4.2.0.LIFERAY-PATCHED-2"
	compileOnly group: "com.liferay", name: "com.liferay.petra.lang", version: "4.0.0"
	compileOnly group: "com.liferay", name: "com.liferay.petra.sql.dsl.api", version: "1.0.0"
